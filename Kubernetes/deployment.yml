apiVersion: apps/v1
kind: Deployment
metadata:
  name: netflix
spec:
  replicas: 2
  selector:
    matchLabels:
      app: netflix
  template:
    metadata:
      labels:
        app: netflix
    spec:
      containers:
      - name: netflix
        image: shantanuvedpathak01/netflix-devsecops:latest
        imagePullPolicy: Always
        ports:
          - containerPort: 80
